<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>대시보드</title>
<style>
  /* 색상 토큰: 원본 대시보드(globals.css)와 동일한 팔레트 */
  :root {
    --background:#F4F6FA; --foreground:#2A3547; --card:#FFFFFF; --primary:#5D87FF; --primary-fg:#FFFFFF;
    --secondary:#ECF2FF; --secondary-fg:#4570EA; --muted:#EEF2F8; --muted-fg:#5A6A85;
    --destructive:#FA896B; --border:#E4E9F2; --radius:12px;
    --sidebar:#111C43; --sidebar-fg:#C9D0E6; --sidebar-primary:#8C7CF0; --sidebar-accent:#1B2850;
  }
  html.dark {
    --background:#0B1220; --foreground:#E7E9F5; --card:#121A2E; --primary:#7C9CFF; --primary-fg:#10162A;
    --secondary:#1B2850; --secondary-fg:#C9D4FF; --muted:#1B2438; --muted-fg:#8B96AE;
    --destructive:#FF9A80; --border:rgba(255,255,255,.08);
  }
  * { box-sizing:border-box; border-color:var(--border); }
  html, body { margin:0; height:100%; }
  body { background:var(--background); color:var(--foreground); font-family:"Pretendard","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif; font-size:14px; }
  button { font:inherit; color:inherit; cursor:pointer; }
  svg.i { width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; flex-shrink:0; }

  .app { display:flex; min-height:100%; }
  aside { width:256px; background:var(--sidebar); padding:24px 16px; display:flex; flex-direction:column; gap:28px; flex-shrink:0; transition:width .2s; }
  aside.collapsed { width:64px; padding:24px 8px; }
  .brand { display:flex; align-items:center; justify-content:space-between; padding:0 8px; gap:8px; }
  aside.collapsed .brand { flex-direction:column; gap:12px; }
  .logo { display:flex; align-items:center; gap:10px; color:#fff; font-weight:700; font-size:16px; }
  .logo b { width:32px; height:32px; border-radius:8px; background:linear-gradient(135deg,#5D87FF,#8C7CF0); display:flex; align-items:center; justify-content:center; font-size:14px; }
  .toggle { width:32px; height:32px; border:0; background:transparent; color:rgba(201,208,230,.6); border-radius:8px; display:flex; align-items:center; justify-content:center; }
  .toggle:hover { background:rgba(27,40,80,.6); color:#fff; }
  .group-title { padding:0 12px 4px; font-size:11px; font-weight:600; color:rgba(201,208,230,.5); }
  aside.collapsed .group-title, aside.collapsed .logo span, aside.collapsed .nav-label { display:none; }
  nav { display:flex; flex-direction:column; gap:4px; }
  nav a { display:flex; align-items:center; gap:12px; padding:8px 12px; border-left:3px solid transparent; border-radius:8px; color:rgba(201,208,230,.8); text-decoration:none; font-weight:500; }
  aside.collapsed nav a { justify-content:center; padding:8px 0; }
  nav a:hover { background:rgba(27,40,80,.6); color:#fff; }
  nav a.active { border-left-color:var(--sidebar-primary); background:var(--sidebar-accent); color:#fff; }

  .main { flex:1; min-width:0; display:flex; flex-direction:column; }
  header { height:64px; background:var(--card); border-bottom:1px solid var(--border); display:flex; align-items:center; padding:0 24px; gap:8px; }
  header h1 { font-size:16px; font-weight:600; margin:0; }
  header .sp { margin-left:auto; display:flex; gap:4px; }
  main { padding:32px; display:flex; flex-direction:column; gap:16px; }
  h2 { font-size:24px; font-weight:600; margin:0; }

  .card { background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:16px; }
  .card h3 { margin:0 0 8px; font-size:15px; font-weight:600; }
  .muted { color:var(--muted-fg); }
  .grid4 { display:grid; grid-template-columns:repeat(4,1fr); gap:16px; }
  .kpi { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; }
  .kpi .l { font-size:13px; color:var(--muted-fg); }
  .kpi .v { font-size:24px; font-weight:600; margin-top:4px; }
  .ico { width:40px; height:40px; border-radius:12px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .ico svg.i { width:20px; height:20px; }

  .btn { border:1px solid var(--border); background:var(--card); border-radius:8px; padding:6px 12px; display:inline-flex; align-items:center; gap:6px; justify-content:center; }
  .btn:hover { background:var(--muted); }
  .btn.on { background:var(--primary); border-color:var(--primary); color:var(--primary-fg); }
  .btn.sm { padding:4px 10px; font-size:12.5px; }
  .btn:disabled { opacity:.5; cursor:not-allowed; }
  .row { display:flex; flex-wrap:wrap; gap:8px; }
  .badge { display:inline-block; padding:2px 8px; border-radius:999px; font-size:12px; font-weight:500; border:1px solid var(--border); white-space:nowrap; }
  .badge.destructive { background:var(--destructive); color:#fff; border-color:transparent; }
  .badge.secondary { background:var(--secondary); color:var(--secondary-fg); border-color:transparent; }
  .empty { border:1px dashed var(--border); border-radius:var(--radius); padding:64px 16px; text-align:center; color:var(--muted-fg); display:flex; flex-direction:column; align-items:center; gap:8px; }
  .empty svg.i { width:32px; height:32px; }

  input[type=range] { width:100%; accent-color:var(--primary); }
  input[type=text], input[type=datetime-local], input[type=date], select { border:1px solid var(--border); background:var(--card); color:inherit; border-radius:8px; padding:7px 10px; font:inherit; }
  .fld { display:flex; flex-direction:column; gap:4px; font-size:13px; }
  .fld span { color:var(--muted-fg); }
  .sheet { overflow-y:auto; }

  .list { display:flex; flex-direction:column; gap:8px; }
  .item { display:flex; align-items:center; gap:12px; padding:12px; border:1px solid var(--border); border-radius:10px; background:transparent; text-align:left; width:100%; }
  .item:hover { background:var(--muted); }
  .item .t { flex:1; display:flex; flex-direction:column; }
  .item .t b { font-size:14px; font-weight:500; }
  .item .t small { font-size:12px; color:var(--muted-fg); }

  .cols { display:flex; gap:16px; }
  .col { flex:1; border:1px solid var(--border); border-radius:10px; padding:12px; display:flex; flex-direction:column; gap:12px; background:var(--card); }
  .col .hd { display:flex; justify-content:space-between; align-items:center; }
  .col .hd b { font-size:14px; }
  .col .hd small { font-size:12px; color:var(--muted-fg); }
  .tcard { border:1px solid var(--border); border-radius:10px; padding:12px; display:flex; flex-direction:column; gap:8px; }
  .tcard .top { display:flex; justify-content:space-between; gap:8px; align-items:flex-start; }
  .tcard .meta { display:flex; justify-content:space-between; font-size:12px; color:var(--muted-fg); }
  .over { color:var(--destructive); font-weight:600; }

  /* 우측 상세 패널 */
  .overlay { position:fixed; inset:0; background:rgba(0,0,0,.4); display:none; z-index:20; }
  .overlay.open { display:block; }
  .sheet { position:fixed; top:0; right:0; bottom:0; width:min(380px,100%); background:var(--card); padding:24px 16px; display:flex; flex-direction:column; gap:16px; transform:translateX(100%); transition:transform .2s; z-index:21; border-left:1px solid var(--border); }
  .sheet.open { transform:none; }
  .sheet h4 { margin:0; font-size:17px; }
  .kv { display:flex; justify-content:space-between; gap:16px; font-size:14px; }

  /* 캘린더 */
  .cal-head { display:flex; align-items:center; gap:8px; }
  .cal-head b { font-size:17px; margin:0 8px; }
  .cal { display:grid; grid-template-columns:repeat(7,1fr); border:1px solid var(--border); border-radius:10px; overflow:hidden; background:var(--card); }
  .cal .dow { padding:8px; text-align:center; font-size:12px; color:var(--muted-fg); background:var(--muted); }
  .cal .day { min-height:96px; padding:4px; border-top:1px solid var(--border); border-left:1px solid var(--border); display:flex; flex-direction:column; gap:2px; }
  .cal .day:nth-child(7n+1) { border-left:0; }
  .cal .day.other { background:var(--muted); opacity:.55; }
  .cal .num { font-size:12px; padding:2px 4px; align-self:flex-start; border-radius:999px; }
  .cal .day.today .num { background:var(--primary); color:var(--primary-fg); }
  .chip { font-size:11.5px; padding:1px 6px; border-radius:4px; text-align:left; border:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; width:100%; }
  .chip.task { background:var(--secondary); color:var(--secondary-fg); }
  .chip.done { text-decoration:line-through; opacity:.6; }
  .chip.mine { background:#8C7CF0; color:#fff; }
  .more { font-size:11px; color:var(--muted-fg); padding:0 6px; }

  @media (max-width:1023px) { aside { display:none; } .grid4 { grid-template-columns:repeat(2,1fr); } main { padding:16px; } }
  @media (max-width:767px) { .cols { flex-direction:column; } .grid4 { grid-template-columns:1fr; } .cal .day { min-height:64px; } }
</style>
</head>
<body>

  <aside id="side"></aside>
  <div class="main">
    <header><h1 id="pageTitle"></h1><div class="sp" id="themeBtns"></div></header>
    <main id="view"></main>
  </div>
</div>
<div class="overlay" id="overlay"></div>
<div class="sheet" id="sheet"></div>

  clock: '<circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2"/><path d="M5 3L2 6M22 6l-3-3"/>',
  film: '<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M7 3v18M17 3v18M3 8h4M3 12h4M3 16h4M17 8h4M17 12h4M17 16h4"/>',
  list: '<path d="M9 6h12M9 12h12M9 18h12"/><path d="M3 6l1 1 2-2M3 12l1 1 2-2M3 18l1 1 2-2"/>',
  cal: '<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
  gear: '<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/>',

  sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  moon: '<path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/>',

const icon = (n) => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${I[n]}</svg>`;

const NAV = [
  { title: "홈", href: "#/", icon: "home", group: "일반" },
  { title: "지연 현황", href: "#/delay", icon: "clock", group: "업무 관리" },
  { title: "업무 관리", href: "#/tasks", icon: "list", group: "일정 관리" },
  { title: "캘린더", href: "#/calendar", icon: "cal", group: "일정 관리" },
  { title: "설정", href: "#/settings", icon: "gear", group: "계정" },
];

/* ===== 데이터 계산 (원본 analytics 로직과 동일) ===== */
const getTasks = () => state.tasks;
const saveTasks = () => store.set("tasks", state.tasks);
const saveEvents = () => store.set("events", state.events);

function getDelayItems() {
  const th = state.threshold;
  const tasks = getTasks().filter(t => t.status !== "done")
    .map(t => ({ kind: "task", id: t.id, title: t.title, subtitle: t.project, daysOverdue: daysPast(t.dueDate), raw: t }))
    .filter(x => x.daysOverdue > th);
  const autos = AUTOMATIONS.filter(a => a.status === "active").map(a => {
    const last = RUNS.filter(r => r.automationId === a.id).sort((x, y) => y.ranAt.localeCompare(x.ranAt))[0];
    return { a, since: last ? daysPast(last.ranAt.slice(0, 10)) : Infinity };
  }).filter(({ a, since }) => since > a.expectedIntervalDays + th)
    .map(({ a, since }) => ({ kind: "automation", id: a.id, title: a.name, subtitle: a.category, daysOverdue: since, raw: a }));
  return [...tasks, ...autos].sort((x, y) => y.daysOverdue - x.daysOverdue);
}
const weeklyCompleted = () => getTasks().filter(t => t.completedAt && daysPast(t.completedAt) < 7).length;
function successRate7d() {
  const recent = RUNS.filter(r => daysPast(r.ranAt.slice(0, 10)) <= 7);
  return recent.length ? recent.filter(r => r.status === "success").length / recent.length : null;
}

/* ===== 공통 UI ===== */
function renderSidebar() {
  const side = document.getElementById("side");
  side.classList.toggle("collapsed", state.collapsed);
  const groups = [...new Set(NAV.map(n => n.group))];
  const cur = location.hash || "#/";
  side.innerHTML = `
    <div class="brand">
      <div class="logo"><b>${esc(SERVICE_NAME[0])}</b><span>${esc(SERVICE_NAME)}</span></div>
      <button class="toggle" id="collapseBtn" aria-label="사이드바 접기/펴기">${icon(state.collapsed ? "right" : "left")}</button>
    </div>` + groups.map(g => `
    <nav aria-label="${esc(g)}"><div class="group-title">${esc(g)}</div>
      ${NAV.filter(n => n.group === g).map(n => `
        <a href="${n.href}" class="${cur === n.href ? "active" : ""}" title="${esc(n.title)}">${icon(n.icon)}<span class="nav-label">${esc(n.title)}</span></a>`).join("")}
    </nav>`).join("");
  document.getElementById("collapseBtn").onclick = () => { state.collapsed = !state.collapsed; store.set("collapsed", state.collapsed); renderSidebar(); };
}
function applyTheme() {
  const dark = state.theme === "dark" || (state.theme === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
  document.documentElement.classList.toggle("dark", dark);
  document.getElementById("themeBtns").innerHTML = ["light", "dark", "system"].map(v =>
    `<button class="btn sm ${state.theme === v ? "on" : ""}" data-theme="${v}" title="${{light:"라이트",dark:"다크",system:"시스템"}[v]}">${icon({light:"sun",dark:"moon",system:"monitor"}[v])}</button>`).join("");
  document.querySelectorAll("[data-theme]").forEach(b => b.onclick = () => { state.theme = b.dataset.theme; store.set("theme", state.theme); applyTheme(); });
}
function openSheet(html) {
  document.getElementById("sheet").innerHTML = html;
  document.getElementById("sheet").classList.add("open");
  document.getElementById("overlay").classList.add("open");
}
function closeSheet() {
  document.getElementById("sheet").classList.remove("open");
  document.getElementById("overlay").classList.remove("open");
}
document.getElementById("overlay").onclick = closeSheet;
document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });
const thresholdLabel = d => d === 0 ? "예정일이 지나면 바로" : `예정일보다 ${d}일 더 지나면`;

/* ===== 페이지 ===== */
const pages = {
  "#/"(v) {
    const todayCount = TASKS0.filter(t => t.dueDate === DATA_ANCHOR).length + state.events.filter(e => e.start.slice(0, 10) === DATA_ANCHOR).length;
    const rate = successRate7d();
    const kpis = [
      { l: "오늘 지연된 업무/자동화", v: getDelayItems().length.toLocaleString("ko-KR"), i: "clock", c: "background:#FFF1E8;color:#FA896B" },
      { l: "오늘 예정된 일정", v: todayCount.toLocaleString("ko-KR") + "건", i: "cal", c: "background:#ECF2FF;color:#4570EA" },
      { l: "이번 주 처리한 업무", v: weeklyCompleted().toLocaleString("ko-KR"), i: "list", c: "background:#E7FBF6;color:#0FBE9E" },
      { l: "자동화 성공률(최근 7일)", v: rate === null ? "-" : Math.round(rate * 100) + "%", i: "flow", c: "background:#FFF6E5;color:#E0980C" },
    ];
    v.innerHTML = `<h2>홈</h2><div class="grid4">${kpis.map(k => `
      <div class="card kpi"><div><div class="l">${k.l}</div><div class="v">${k.v}</div></div>
      <div class="ico" style="${k.c}">${icon(k.i)}</div></div>`).join("")}</div>`;
  },

  "#/delay"(v) {
    const draw = () => {
      const items = getDelayItems();
      v.innerHTML = `<h2>지연 현황</h2>
        <div class="card"><div class="kv" style="margin-bottom:8px"><b>지연 기준</b><span class="muted">${thresholdLabel(state.threshold)}</span></div>
          <input type="range" id="th" min="0" max="14" step="1" value="${state.threshold}"></div>
        <p class="muted" style="margin:0">${items.length}건이 지연되고 있어요</p>
        ${items.length === 0 ? `<div class="empty">${icon("clock")}<p>지연된 항목이 없어요. 기준을 조절해 보세요.</p></div>` :
        `<div class="list">${items.map((it, n) => `
          <button class="item" data-n="${n}">${icon(it.kind === "task" ? "list" : "flow")}
            <div class="t"><b>${esc(it.title)}</b><small>${esc(it.subtitle)}</small></div>
            <span class="badge destructive">${it.kind === "task" ? "D+" + it.daysOverdue : it.daysOverdue + "일째 미실행"}</span></button>`).join("")}</div>`}`;
      const th = document.getElementById("th");
      th.oninput = () => { state.threshold = +th.value; store.set("threshold", state.threshold); draw(); document.getElementById("th").focus(); };
      v.querySelectorAll(".item").forEach(b => b.onclick = () => showDelayDetail(items[+b.dataset.n]));
    };
    draw();
  },

  "#/tasks"(v) {
    const draw = () => {
      const all = getTasks();
      const projects = [...new Set(all.map(t => t.project))];
      if (state.project !== "전체" && !projects.includes(state.project)) state.project = "전체"; // 삭제로 사라진 프로젝트 필터 해제
      const list = state.project === "전체" ? all : all.filter(t => t.project === state.project);
      const col = (title, status) => {
        const ts = list.filter(t => t.status === status);
        return `<div class="col"><div class="hd"><b>${title}</b><small>${ts.length}건</small></div>
          ${ts.length === 0 ? `<p class="empty" style="padding:32px 8px;font-size:12px">아직 없어요</p>` : ts.map(card).join("")}</div>`;
      };
      const card = t => {
        const over = daysPast(t.dueDate) > 0 && t.status !== "done";
        const next = { todo: "진행중으로", in_progress: "완료로" }[t.status];
        return `<div class="tcard"><div class="top"><span style="font-weight:500">${esc(t.title)}</span>
          <span class="badge ${PRIORITY_CLS[t.priority]}">${PRIORITY[t.priority]}</span></div>
          <div class="meta"><span>${esc(t.project)}</span><span class="${over ? "over" : ""}">${formatDday(t.dueDate)}</span></div>
          <div class="row">${next ? `<button class="btn sm" data-move="${t.id}">${next} 이동</button>` : ""}
            <button class="btn sm" data-edit="${t.id}">수정</button>
            <button class="btn sm" data-del="${t.id}" style="color:var(--destructive)">삭제</button></div></div>`;
      };
      v.innerHTML = `<div class="row" style="justify-content:space-between;align-items:center"><h2>업무 관리</h2><button class="btn on" id="newTask">+ 새 업무</button></div>
        <div class="row">${["전체", ...projects].map(p => `<button class="btn sm ${p === state.project ? "on" : ""}" data-p="${esc(p)}">${esc(p)}</button>`).join("")}</div>
        <div class="cols">${col("할 일", "todo")}${col("진행중", "in_progress")}${col("완료", "done")}</div>`;
      v.querySelectorAll("[data-p]").forEach(b => b.onclick = () => { state.project = b.dataset.p; draw(); });
      v.querySelectorAll("[data-move]").forEach(b => b.onclick = () => {
        const t = getTasks().find(x => x.id === b.dataset.move);
        t.status = t.status === "todo" ? "in_progress" : "done";
        if (t.status === "done") t.completedAt = DATA_ANCHOR;
        saveTasks(); draw();
      });
      document.getElementById("newTask").onclick = () => openTaskForm(null);
      v.querySelectorAll("[data-edit]").forEach(b => b.onclick = () => openTaskForm(getTasks().find(x => x.id === b.dataset.edit)));
      v.querySelectorAll("[data-del]").forEach(b => b.onclick = () => {
        const t = getTasks().find(x => x.id === b.dataset.del);
        if (confirm(`"${t.title}" 업무를 삭제할까요?`)) { state.tasks = state.tasks.filter(x => x.id !== t.id); saveTasks(); draw(); }
      });
    };
    draw();
  },

  "#/calendar"(v) {
    const draw = () => {
      const m = state.month, y = m.getFullYear(), mo = m.getMonth();
      const start = new Date(y, mo, 1 - new Date(y, mo, 1).getDay());       // 첫 주 일요일부터
      const weeks = Math.ceil((new Date(y, mo, 1).getDay() + new Date(y, mo + 1, 0).getDate()) / 7);
      // 날짜별 일정 모으기: 업무 마감일 + 내가 추가한 일정
      const byDay = {};
      const put = (k, e) => (byDay[k] = byDay[k] || []).push(e);
      getTasks().forEach(t => put(t.dueDate, { cls: "task" + (t.status === "done" ? " done" : ""), text: t.title, taskId: t.id }));
      state.events.forEach(e => put(e.start.slice(0, 10), { cls: "mine", text: e.start.slice(11, 16) + " " + e.title, id: e.id }));
      let cells = ["일", "월", "화", "수", "목", "금", "토"].map(d => `<div class="dow">${d}</div>`).join("");
      for (let i = 0; i < weeks * 7; i++) {
        const d = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i), k = dateKey(d), ev = byDay[k] || [];
        cells += `<div class="day ${d.getMonth() !== mo ? "other" : ""} ${k === DATA_ANCHOR ? "today" : ""}"><span class="num">${d.getDate()}</span>
          ${ev.slice(0, 3).map(e => `<button class="chip ${e.cls}" ${e.id ? `data-ev="${e.id}"` : `data-task="${e.taskId}"`} title="${esc(e.text)}">${esc(e.text)}</button>`).join("")}
          ${ev.length > 3 ? `<span class="more">+${ev.length - 3}개 더</span>` : ""}</div>`;
      }
      v.innerHTML = `<h2>캘린더</h2>
        <div class="cal-head"><button class="btn sm" id="prev">${icon("chevL")}</button><b>${y}년 ${mo + 1}월</b>
          <button class="btn sm" id="next">${icon("chevR")}</button><button class="btn sm" id="today" style="margin-left:8px">오늘</button></div>
        <div class="cal">${cells}</div>
        <p class="muted" style="margin:0;font-size:12px">파란 칩은 업무 마감일, 보라 칩은 직접 추가한 일정이에요. 칩을 누르면 수정·삭제할 수 있어요. (구글 캘린더 연동은 로그인이 필요해 제외했어요)</p>
        <div class="card"><h3>새 일정 추가</h3><div class="row">
          <input type="text" id="evTitle" placeholder="일정 제목" style="flex:1;min-width:160px">
          <input type="datetime-local" id="evStart"><button class="btn on" id="evAdd" disabled>추가</button></div></div>`;
      document.getElementById("prev").onclick = () => { state.month = new Date(y, mo - 1, 1); draw(); };
      document.getElementById("next").onclick = () => { state.month = new Date(y, mo + 1, 1); draw(); };
      document.getElementById("today").onclick = () => { const a = new Date(DATA_ANCHOR + "T00:00:00"); state.month = new Date(a.getFullYear(), a.getMonth(), 1); draw(); };
      const t = document.getElementById("evTitle"), s = document.getElementById("evStart"), add = document.getElementById("evAdd");
      const sync = () => add.disabled = !(t.value.trim() && s.value);
      t.oninput = s.oninput = sync;
      add.onclick = () => {
        state.events.push({ id: "ev-" + Date.now(), title: t.value.trim(), start: s.value });
        saveEvents(); draw();
      };
      v.querySelectorAll("[data-ev]").forEach(b => b.onclick = () => openEventForm(state.events.find(e => e.id === b.dataset.ev)));
      v.querySelectorAll("[data-task]").forEach(b => b.onclick = () => openTaskForm(getTasks().find(x => x.id === b.dataset.task)));
    };
    draw();
  },

  "#/settings"(v) {
    const draw = () => {
      v.innerHTML = `<h2>설정</h2>
        <div class="card"><h3>테마</h3><div class="row">${[["light","라이트","sun"],["dark","다크","moon"],["system","시스템","monitor"]].map(([val, lab, ic]) =>
          `<button class="btn ${state.theme === val ? "on" : ""}" style="flex:1" data-t="${val}">${icon(ic)}${lab}</button>`).join("")}</div></div>
        <div class="card"><h3>지연 판정 기준값</h3>
          <div class="kv" style="margin-bottom:8px"><b style="font-weight:500">지연 기준</b><span class="muted">${thresholdLabel(state.threshold)}</span></div>
          <input type="range" id="th" min="0" max="14" step="1" value="${state.threshold}"></div>
        <div class="card"><h3>저장된 변경 내용 초기화</h3>
          <p class="muted" style="margin-top:0">업무·일정을 추가·수정·삭제한 내용과 기준값은 이 브라우저에만 저장돼요.</p>
          <button class="btn" id="reset">모두 초기화</button></div>`;
      v.querySelectorAll("[data-t]").forEach(b => b.onclick = () => { state.theme = b.dataset.t; store.set("theme", state.theme); applyTheme(); draw(); });
      const th = document.getElementById("th");
      th.oninput = () => { state.threshold = +th.value; store.set("threshold", state.threshold); draw(); document.getElementById("th").focus(); };
      document.getElementById("reset").onclick = () => {
        if (!confirm("업무·일정 변경 내용과 지연 기준값을 모두 처음 상태로 되돌릴까요?")) return;
        Object.assign(state, { tasks: JSON.parse(JSON.stringify(TASKS0)), events: [], threshold: 0 });
        ["tasks", "events", "threshold"].forEach(k => store.set(k, state[k]));
        draw();
      };
    };
    draw();
  },
};

function showDelayDetail(it) {
  const rows = it.kind === "task"
    ? [["마감일", it.raw.dueDate], ["우선순위", PRIORITY[it.raw.priority]], ["지연일", `<span class="badge destructive">D+${it.daysOverdue}</span>`]]
    : [["실행 주기", esc(it.raw.scheduleLabel)], ["설명", esc(it.raw.description)], ["미실행 기간", `<span class="badge destructive">${it.daysOverdue}일째</span>`]];
  openSheet(`<div><h4>${esc(it.title)}</h4><div class="muted">${esc(it.subtitle)}</div></div>
    ${rows.map(([k, val]) => `<div class="kv"><span class="muted">${k}</span><span>${val}</span></div>`).join("")}
    ${it.kind === "task" ? `<button class="btn on" id="dEdit">업무 수정</button>` : ""}
    <button class="btn" onclick="closeSheet()">닫기</button>`);
  if (it.kind === "task") document.getElementById("dEdit").onclick = () => openTaskForm(it.raw);
}

/* ===== 추가·수정·삭제 폼 (오른쪽 패널) ===== */
const field = (label, input) => `<label class="fld"><span>${label}</span>${input}</label>`;
const options = (pairs, cur) => pairs.map(([k, l]) => `<option value="${k}" ${cur === k ? "selected" : ""}>${l}</option>`).join("");
const $ = id => document.getElementById(id);

// t가 null이면 새 업무 추가, 있으면 수정(+삭제)
function openTaskForm(t) {
  const isNew = !t;
  const d = t || { title: "", project: state.project !== "전체" ? state.project : "", dueDate: DATA_ANCHOR, priority: "medium", status: "todo" };
  const projects = [...new Set(state.tasks.map(x => x.project))];
  openSheet(`<h4>${isNew ? "새 업무" : "업무 수정"}</h4>
    ${field("제목", `<input type="text" id="fTitle" value="${esc(d.title)}">`)}
    ${field("프로젝트", `<input type="text" id="fProject" list="projList" value="${esc(d.project)}"><datalist id="projList">${projects.map(p => `<option value="${esc(p)}">`).join("")}</datalist>`)}
    ${field("마감일", `<input type="date" id="fDue" value="${d.dueDate}">`)}
    ${field("우선순위", `<select id="fPri">${options(Object.entries(PRIORITY), d.priority)}</select>`)}
    ${field("상태", `<select id="fStatus">${options([["todo", "할 일"], ["in_progress", "진행중"], ["done", "완료"]], d.status)}</select>`)}
    <p class="muted" id="fErr" style="margin:0;color:var(--destructive)"></p>
    <div class="row" style="margin-top:auto">
      ${isNew ? "" : `<button class="btn" id="fDel" style="color:var(--destructive)">삭제</button>`}
      <button class="btn" id="fCancel" style="margin-left:auto">취소</button><button class="btn on" id="fSave">저장</button></div>`);
  $("fCancel").onclick = closeSheet;
  $("fSave").onclick = () => {
    const title = $("fTitle").value.trim(), project = $("fProject").value.trim(), dueDate = $("fDue").value;
    if (!title || !project || !dueDate) { $("fErr").textContent = "제목, 프로젝트, 마감일은 꼭 입력해 주세요."; return; }
    const status = $("fStatus").value, priority = $("fPri").value;
    if (isNew) {
      state.tasks.push({ id: "task-" + Date.now(), title, project, dueDate, status, priority, createdAt: DATA_ANCHOR, completedAt: status === "done" ? DATA_ANCHOR : null });
    } else {
      // 완료로 바꾸면 완료일 기록, 완료가 아니게 바꾸면 완료일 삭제
      const completedAt = status === "done" ? (t.completedAt || DATA_ANCHOR) : null;
      Object.assign(t, { title, project, dueDate, status, priority, completedAt });
    }
    saveTasks(); route();
  };
  if (!isNew) $("fDel").onclick = () => {
    if (!confirm(`"${t.title}" 업무를 삭제할까요?`)) return;
    state.tasks = state.tasks.filter(x => x.id !== t.id); saveTasks(); route();
  };
}

// ev가 있으면 내가 추가한 일정 수정(+삭제)
function openEventForm(ev) {
  openSheet(`<h4>일정 수정</h4>
    ${field("제목", `<input type="text" id="eTitle" value="${esc(ev.title)}">`)}
    ${field("일시", `<input type="datetime-local" id="eStart" value="${ev.start}">`)}
    <p class="muted" id="eErr" style="margin:0;color:var(--destructive)"></p>
    <div class="row" style="margin-top:auto">
      <button class="btn" id="eDel" style="color:var(--destructive)">삭제</button>
      <button class="btn" id="eCancel" style="margin-left:auto">취소</button><button class="btn on" id="eSave">저장</button></div>`);
  $("eCancel").onclick = closeSheet;
  $("eSave").onclick = () => {
    const title = $("eTitle").value.trim(), start = $("eStart").value;
    if (!title || !start) { $("eErr").textContent = "제목과 일시를 입력해 주세요."; return; }
    Object.assign(ev, { title, start }); saveEvents(); route();
  };
  $("eDel").onclick = () => {
    if (!confirm("이 일정을 삭제할까요?")) return;
    state.events = state.events.filter(e => e.id !== ev.id); saveEvents(); route();
  };
}

/* ===== 라우터 ===== */
function route() {
  const h = pages[location.hash] ? location.hash : "#/";
  closeSheet();
  document.getElementById("pageTitle").textContent = NAV.find(n => n.href === h).title;
  renderSidebar();
  pages[h](document.getElementById("view"));
}
addEventListener("hashchange", route);
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", applyTheme);
applyTheme();
route();
</script>
</body>
</html>
